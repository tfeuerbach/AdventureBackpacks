# Mirror Vapok/AdventureBackpacks releases into this fork.
#
# Policy:
# 1. Poll latest upstream GitHub release (or a workflow_dispatch tag).
# 2. Merge into a sync/* branch.
# 3. Conflicts outside .github/fork-protected-paths.txt → take upstream automatically.
# 4. Conflicts inside protected paths → open PR + notify; do NOT touch main.
# 5. Clean / auto-resolved merge → run fork regression tests.
# 6. Tests pass → auto-merge PR into main, then publish fork release <upstreamTag>a
#    (e.g. upstream v2.2.11 → fork release v2.2.11a).
# 7. Tests fail → leave PR open; do NOT merge / do NOT release.
# Notification = failed Actions run (watch the repo) + open PR labeled needs-human.
# Manual sync PR merges are covered by fork-release-on-sync.yml.

name: Mirror upstream release

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release tag to sync (empty = latest)'
        required: false
        type: string
      force:
        description: 'Re-run even if this tag is already recorded as synced'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: mirror-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Mirror upstream release
        id: mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: Vapok/AdventureBackpacks
          UPSTREAM_TAG_OVERRIDE: ${{ inputs.tag }}
          FORCE_SYNC: ${{ inputs.force }}
        run: |
          chmod +x .github/scripts/mirror-upstream.sh
          .github/scripts/mirror-upstream.sh

      - name: Push sync branch
        if: steps.mirror.outputs.already_synced != 'true'
        run: git push -u origin "HEAD:${{ steps.mirror.outputs.sync_branch }}" --force

      - name: Setup .NET
        if: steps.mirror.outputs.already_synced != 'true' && steps.mirror.outputs.needs_human != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run fork regression tests
        id: tests
        if: steps.mirror.outputs.already_synced != 'true' && steps.mirror.outputs.needs_human != 'true'
        continue-on-error: true
        run: |
          set +e
          dotnet test AdventureBackpacks.Tests/AdventureBackpacks.Tests.csproj --configuration Release --verbosity minimal
          if [ $? -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Open or update sync PR
        id: pr
        if: steps.mirror.outputs.already_synced != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.mirror.outputs.sync_branch }}
          TAG: ${{ steps.mirror.outputs.latest_tag }}
          URL: ${{ steps.mirror.outputs.latest_url }}
          STATUS: ${{ steps.mirror.outputs.merge_status }}
          NEEDS_HUMAN: ${{ steps.mirror.outputs.needs_human }}
          TESTS: ${{ steps.tests.outputs.passed }}
          CONFLICTS: ${{ steps.mirror.outputs.protected_conflicts }}
        run: |
          set -euo pipefail

          if [ "$NEEDS_HUMAN" = "true" ]; then
            TITLE="[needs review] Upstream ${TAG} — protected-path conflict"
            BODY=$(cat <<EOF
          ## Upstream sync needs you

          Upstream release: [${TAG}](${URL})

          Merge hit **protected-path conflicts**. Auto-sync stopped so fork behavior is not overwritten.

          ### Protected conflicts
          \`\`\`
          ${CONFLICTS}
          \`\`\`

          ### What to do
          1. Check out \`${BRANCH}\`
          2. Resolve conflicts in the files above (keep fork side-panel behavior)
          3. Run \`dotnet test AdventureBackpacks.Tests/AdventureBackpacks.Tests.csproj\`
          4. Merge this PR when green

          Protected path list: \`.github/fork-protected-paths.txt\`
          EOF
          )
            LABEL_ARGS=(--label upstream-sync --label needs-human)
          elif [ "${TESTS:-}" != "true" ]; then
            TITLE="[needs review] Upstream ${TAG} — fork tests failed"
            BODY=$(cat <<EOF
          ## Upstream sync needs you

          Upstream release: [${TAG}](${URL})

          Merge completed (\`${STATUS}\`), but **fork regression tests failed**.
          \`main\` was **not** updated.

          ### What to do
          1. Check out \`${BRANCH}\`
          2. Fix failures from \`AdventureBackpacks.Tests\`
          3. Push and merge this PR when green

          \`\`\`bash
          dotnet test AdventureBackpacks.Tests/AdventureBackpacks.Tests.csproj
          \`\`\`
          EOF
          )
            LABEL_ARGS=(--label upstream-sync --label needs-human --label tests-failed)
          else
            TITLE="chore: sync upstream ${TAG}"
            BODY=$(cat <<EOF
          ## Automatic upstream sync

          Upstream release: [${TAG}](${URL})

          - Merge status: \`${STATUS}\`
          - Fork regression tests: **passed**
          - This PR will be auto-merged into \`main\`.
          EOF
          )
            LABEL_ARGS=(--label upstream-sync --label auto)
          fi

          gh label create upstream-sync --force --color 0E8A16 --description "Upstream mirror" 2>/dev/null || true
          gh label create needs-human --force --color D93F0B --description "Needs manual review" 2>/dev/null || true
          gh label create tests-failed --force --color B60205 --description "Fork tests failed" 2>/dev/null || true
          gh label create auto --force --color 5319E7 --description "Auto-merged sync" 2>/dev/null || true

          EXISTING="$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' || true)"
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
            PR_URL="$(gh pr view "$EXISTING" --json url --jq .url)"
          else
            PR_URL="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY" "${LABEL_ARGS[@]}")"
          fi

          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "PR: ${PR_URL}"

      - name: Record sync state after green tests
        if: |
          steps.mirror.outputs.already_synced != 'true' &&
          steps.mirror.outputs.needs_human != 'true' &&
          steps.tests.outputs.passed == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.mirror.outputs.latest_tag }}"
          python - <<PY
          import json, datetime, pathlib
          path = pathlib.Path(".github/upstream-sync-state.json")
          data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          data["upstream_repo"] = "Vapok/AdventureBackpacks"
          data["last_synced_tag"] = "${TAG}"
          data["last_synced_at"] = datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z"
          data["note"] = "Updated automatically by mirror-upstream.yml after a successful sync."
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          git add .github/upstream-sync-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record upstream sync ${TAG}"
            git push origin "HEAD:${{ steps.mirror.outputs.sync_branch }}"
          fi

      - name: Auto-merge when tests passed
        if: |
          steps.mirror.outputs.already_synced != 'true' &&
          steps.mirror.outputs.needs_human != 'true' &&
          steps.tests.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.pr.outputs.pr_url }}" --merge --delete-branch \
            --subject "chore: sync upstream ${{ steps.mirror.outputs.latest_tag }}"
          echo "Auto-merged ${{ steps.pr.outputs.pr_url }}"

      - name: Publish fork release (upstream tag + a)
        if: |
          steps.mirror.outputs.already_synced != 'true' &&
          steps.mirror.outputs.needs_human != 'true' &&
          steps.tests.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          chmod +x .github/scripts/create-fork-release.sh
          TARGET_COMMIT="$(git rev-parse origin/main)" \
            .github/scripts/create-fork-release.sh "${{ steps.mirror.outputs.latest_tag }}"

      - name: Fail job when human needed or tests failed
        if: |
          steps.mirror.outputs.already_synced != 'true' &&
          (steps.mirror.outputs.needs_human == 'true' || steps.tests.outputs.passed == 'false')
        run: |
          echo "::error::Upstream sync paused for review. PR: ${{ steps.pr.outputs.pr_url }}"
          exit 1
